# Nginx의 http 블록에서 이 파일을 포함합니다(예: /etc/nginx/conf.d/).
# FastAPI는 같은 호스트의 127.0.0.1:8000에서 실행합니다.
# 키가 비어 있으면 제한에서 제외하므로 영수증 파싱 POST 요청만 횟수에 포함됩니다.
# $uri는 정규화된 경로이며 쿼리 파라미터를 제외합니다. 끝의 / 유무와 관계없이 한도를 공유합니다.
map "$request_method:$uri" $receipt_parse_ip {
    default "";
    ~^POST:/receipts/parse/?$ $binary_remote_addr;
}

limit_req_zone $receipt_parse_ip zone=receipt_parse_per_ip:10m rate=5r/m;

server {
    listen 8080;
    server_name _;

    # 요청 본문 전체: 이미지 10 MiB + multipart 부가 데이터 최대 1 MiB.
    # /receipts/parse와 /receipts/parse/를 포함한 모든 경로에 적용
    client_max_body_size 11m;

    # 청크 전송을 포함해 요청 본문을 모두 받은 뒤 백엔드로 전달합니다.
    # 크기를 초과한 요청은 FastAPI의 multipart 파서에 도달하기 전에 차단합니다.
    proxy_request_buffering on;

    # IP당 평균 분당 5회로 제한하며, 최대 5회의 연속 요청을 즉시 허용합니다.
    # 한도를 초과한 요청은 백엔드 전달을 위해 대기시키지 않고 즉시 거부합니다.
    limit_req zone=receipt_parse_per_ip burst=4 nodelay;
    limit_req_status 429;

    error_page 429 = @receipt_rate_limited;
    location @receipt_rate_limited {
        default_type application/json;
        add_header Retry-After 12 always;
        return 429 '{"detail":"Too many receipt parsing requests. Try again in 12 seconds."}';
    }

    error_page 413 = @request_too_large;
    location @request_too_large {
        default_type application/json;
        return 413 '{"detail":"Request body exceeds 11 MiB"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
